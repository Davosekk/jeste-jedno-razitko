name: Testy a Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Instalace knihoven
        run: python -m pip install -r requirements-build.txt
      - name: Testy hernich pravidel a kolizi
        run: python -m unittest discover -s tests -v
      - name: Sestaveni Windows aplikace
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Jeste_jedno_razitko main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jeste-jedno-razitko-Windows
          path: dist/Jeste_jedno_razitko.exe
          if-no-files-found: error
          retention-days: 14
